<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tu Universo de Flores</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>


    <!-- Contenedor del Universo 3D -->
    <div id="universe">
        <div id="galaxy">
            <!-- Los elementos se generan aquí con JavaScript -->
        </div>
    </div>

    <!-- Modal de estilo Cristal (Glassmorphism) -->
    <div class="modal-overlay" id="modal">
        <div class="glass-card">
            <div class="card-icon" id="modal-icon">🌻</div>
            <h2 id="modal-title">Título</h2>
            <p id="modal-text">Texto del mensaje aquí...</p>
            <button id="close-btn">Guardar en el corazón</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
